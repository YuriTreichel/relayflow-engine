version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: relayflow_rabbitmq
    ports:
      - "5672:5672" # Porta de comunicação do RabbitMQ
      - "15672:15672" # Porta da interface visual no navegador
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:alpine
    container_name: relayflow_redis
    ports:
      - "6379:6379"

volumes:
  rabbitmq_data: